name = "thatmikehamilton"
main = "src/index.js"
compatibility_date = "2026-09-22"

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Private bucket that holds the free Make the Show workbook PDF.
# Served by src/index.js at /download/make-the-show-workbook.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "thatmikehamilton-downloads"
